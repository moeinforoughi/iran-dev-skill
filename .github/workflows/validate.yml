name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate project structure without network probes
        run: bash scripts/validate-project.sh
      - name: Require a work-log entry for pull requests
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/check-governance-update.sh "$BASE_SHA" HEAD
      - name: Require a work-log entry for pushes
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/check-governance-update.sh "$BASE_SHA" "$HEAD_SHA"
